<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <meta name="description" content="一方悬浮在深空中的透明玻璃微缩世界，雪山、河流、瀑布、森林与微小生灵在昼夜光线中安静呼吸。">
  <title>浮光微境 · A Floating Terrarium</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cormorant-italic-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <canvas id="scene-canvas" aria-label="悬浮在深空中的玻璃微缩生态景观"></canvas>

    <div class="screen-tint" aria-hidden="true"></div>

    <div class="interface">
      <header class="brand">
        <div class="brand-kicker">
          <span class="brand-index">NO. 01</span>
          <span class="brand-rule"></span>
          <span>LIVING TERRARIUM</span>
        </div>
        <h1>浮光微境</h1>
        <p class="brand-subtitle">一方悬浮于深空的透明微缩世界</p>
      </header>

      <div class="auto-wrap">
        <button id="auto-toggle" class="auto-toggle" type="button" aria-pressed="true" aria-label="暂停昼夜流转">
          <span class="status-orb" aria-hidden="true"><span></span></span>
          <span class="auto-copy">
            <span class="auto-title">昼夜流转</span>
            <small id="auto-state">缓慢交替中</small>
          </span>
          <span class="switch" aria-hidden="true"><i></i></span>
        </button>
      </div>

      <aside class="scene-note" aria-label="场景信息">
        <span class="scene-note-index">SCENE 01</span>
        <span class="scene-note-title">深空 · 玻璃微境</span>
        <span class="scene-note-line" aria-hidden="true"></span>
        <span class="scene-note-spec">MACRO 1:87 / TILT-SHIFT</span>
      </aside>

      <div class="drag-note" aria-hidden="true">
        <span class="drag-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M12 3.5v17M3.5 12h17"/>
            <path d="m8.5 6.5 3.5-3 3.5 3M8.5 17.5l3.5 3 3.5-3M6.5 8.5l-3 3.5 3 3.5M17.5 8.5l3 3.5-3 3.5"/>
          </svg>
        </span>
        <span>拖拽环绕 · 滚轮推近 · 双击归位</span>
      </div>

      <section class="time-console" aria-label="一天中的时间">
        <div class="time-topline">
          <span class="time-phase" id="phase-label">午后</span>
          <span class="time-clock" id="clock-label">16:19</span>
        </div>
        <div class="timeline-shell">
          <input id="time-range" class="time-range" type="range" min="0" max="1" step="0.001" value="0.68" aria-label="调整一天中的时间">
          <div class="timeline-ticks" aria-hidden="true">
            <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
          </div>
        </div>
      </section>

      <div class="edition-note" aria-hidden="true">
        <span class="edition-dot"></span>
        <span>GLASS EDITION</span>
        <span class="edition-line"></span>
        <span>MMXXVI</span>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="loader-mark" aria-hidden="true">
        <span class="loader-face loader-face-a"></span>
        <span class="loader-face loader-face-b"></span>
        <span class="loader-face loader-face-c"></span>
      </div>
      <p class="loader-title">正在唤醒一方微境</p>
      <p class="loader-subtitle">CULTIVATING A SMALL WORLD</p>
      <div class="loader-track" aria-hidden="true"><i></i></div>
    </div>

    <div id="error-panel" class="error-panel" role="alert">
      <span class="error-kicker">THE GLASS IS CLOUDED</span>
      <h2>微境未能如约展开</h2>
      <p id="error-message">请使用支持 WebGL 2 的现代浏览器，并确认硬件加速已开启。</p>
      <button type="button" onclick="location.reload()">重新尝试</button>
    </div>

    <noscript>
      <div class="noscript">这片微境需要 JavaScript 才能展开。</div>
    </noscript>
  </main>

  <script>
    window.__dshSceneErrors = [];
    window.addEventListener('error', function (event) {
      window.__dshSceneErrors.push(String(event.message || event.error || 'Unknown rendering error'));
      var panel = document.getElementById('error-panel');
      var message = document.getElementById('error-message');
      if (panel && message) {
        message.textContent = String(event.message || '场景渲染遇到问题，请刷新页面。');
        panel.classList.add('is-visible');
        document.documentElement.dataset.sceneError = 'true';
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.__dshSceneErrors.push(String(event.reason || 'Unhandled promise rejection'));
      var panel = document.getElementById('error-panel');
      var message = document.getElementById('error-message');
      if (panel && message) {
        message.textContent = String(event.reason || '场景加载遇到问题，请刷新页面。');
        panel.classList.add('is-visible');
        document.documentElement.dataset.sceneError = 'true';
      }
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
